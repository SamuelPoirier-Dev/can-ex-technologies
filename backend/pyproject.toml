[project]
name = "monopoly-backend"
version = "0.1.0"
description = "Simplified multiplayer Monopoly - API"
authors = [
    { name = "Samuel Poirier", email = "ici.samuel.poirier@protonmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.156.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
